[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.11.1", "numpy>=1.26.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acm_engine"
version = "1.0.0"
description = "Autonomous Constellation Manager - NSH 2026"
requires-python = ">=3.10"
dynamic = ["dependencies"]  # provided by setup.py (read from requirements.txt)

[tool.setuptools.packages.find]
include = ["satellite_api*"]  # the C++ acm_engine extension is declared in setup.py

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
