# Prometheus scrape + rule config for the `monitoring` compose profile
# (docker compose -f docker-compose.prod.yml --profile monitoring up -d).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: acm-backend
    metrics_path: /metrics
    # If the backend has METRICS_TOKEN set, uncomment and put the token in monitoring/metrics_token
    # (and add `- ./monitoring/metrics_token:/etc/prometheus/metrics_token:ro` to the prometheus volumes).
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token
    dns_sd_configs:
      # Resolves every `backend` replica when scaled with --scale backend=N.
      - names: ["backend"]
        type: A
        port: 8000
