# Alertmanager routing. Replace the receiver with your paging/chat integration (Slack, PagerDuty,
# email, a webhook...). Until then alerts are visible in Prometheus (:9090/alerts) and Alertmanager (:9093).
route:
  receiver: ops
  group_by: [alertname, feed]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: ops
      repeat_interval: 30m

receivers:
  - name: ops
    # webhook_configs:
