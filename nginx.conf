# TLS is on by default: plain HTTP only redirects to HTTPS. Provision a real certificate for
# production (e.g. certbot/Let's Encrypt, or your org's CA) and mount it at the paths below.
# For local/staging bring-up without a real cert yet, run scripts/generate-dev-cert.sh to create
# a self-signed pair in ./certs - browsers/clients will warn/reject it, which is expected; never
# use a self-signed cert for a real deployment.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 64m;   # large telemetry payloads (100k+ objects)

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events: disable buffering so snapshots stream immediately
    location /api/stream/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
