services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      # Leave empty to disable API-key auth; when set, clients must send X-API-Key
      # (build the dashboard with VITE_API_KEY to match).
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-0}
      # Mission state survives restarts: snapshots in Redis, history in the SQLite archive under /app/data
      - REDIS_URL=redis://redis:6379/0
      - REDIS_SAVE_INTERVAL_S=10
      - ACM_ARCHIVE=1
      - AUTOPILOT=${AUTOPILOT:-1}
      # Real-world data on startup (CelesTrak source keys, see GET /api/catalog/sources); empty = off
      - REALWORLD_FLEET=${REALWORLD_FLEET:-}
      - REALWORLD_OBJECTS=${REALWORLD_OBJECTS:-fengyun-1c-debris,cosmos-2251-debris,iridium-33-debris}
      - REALWORLD_LIVE=${REALWORLD_LIVE:-1}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Optional TLS/edge proxy on port 80 in front of the backend (which already serves the UI).
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  redis_data:
