services:
  # Single-replica by default. To run N replicas for HA, `docker compose up --scale backend=N`:
  # all replicas share REDIS_URL and elect one leader (state_redis.py) to run the
  # autopilot/screening loops; the rest serve reads and reject mutating requests with 503
  # (LeaderGateMiddleware) so a client hitting a non-leader replica retries instead of silently
  # losing the write. Each replica should still get its own ACM_DB_PATH/data volume - the SQLite
  # archive is not a shared multi-writer store, only Redis is.
  backend:
    # Deployments pull a released image (BACKEND_IMAGE=ghcr.io/<owner>/<repo>:<tag>, see
    # scripts/deploy.sh); without it, compose builds from source and tags the result locally.
    image: ${BACKEND_IMAGE:-nsh-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Resource ceilings: the C++ screening engine is multi-threaded (OpenMP) and the catalog/
    # snapshot buffers dominate memory. Raise both for 20k+ objects or several hundred satellites.
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPUS:-2.0}"
          memory: ${BACKEND_MEMORY:-2g}
        reservations:
          memory: 512m
    # No host port mapping: nginx is the only ingress (TLS on :443), so plain HTTP on :8000
    # can't be reached directly from outside the compose network, bypassing TLS. Add back
    # "8000:8000" temporarily if you need to hit the backend directly for local debugging.
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      # Leave both empty to disable API-key auth entirely. Operator keys can do everything
      # (including commanding maneuvers); readonly keys can only GET. Comma-separated for
      # multiple operators/keys (rotate by adding a new one before removing the old).
      # (build the dashboard with VITE_API_KEY set to one of the operator keys to match.)
      - API_KEYS_OPERATOR=${API_KEYS_OPERATOR:-}
      - API_KEYS_READONLY=${API_KEYS_READONLY:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-0}
      # Only trust X-Forwarded-For/X-Real-IP (for rate limiting) from these peer IPs - set to
      # the nginx service's address if running behind it, otherwise leave empty.
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
      # Comma-separated allow-list for browser-based clients on a different origin than this
      # backend; leave empty for same-origin only (the bundled dashboard needs no CORS grant).
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Mission state survives restarts: snapshots in Redis, history in the SQLite archive under /app/data.
      # REQUIRE_DURABLE_STATE=1 refuses to start rather than silently running in-memory-only if
      # Redis is unreachable - appropriate for a real deployment, off by default for local/demo use.
      # REDIS_PASSWORD must be set in your .env (see .env.example) - compose fails fast below
      # rather than silently starting Redis unauthenticated.
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file}@redis:6379/0
      # High availability (`ha` profile): set REDIS_SENTINELS=sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      # in .env - the backend then follows whichever node the sentinels promote (redis_conn.py).
      - REDIS_SENTINELS=${REDIS_SENTINELS:-}
      - REDIS_SENTINEL_MASTER=${REDIS_SENTINEL_MASTER:-acm}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SAVE_INTERVAL_S=10
      - REQUIRE_DURABLE_STATE=${REQUIRE_DURABLE_STATE:-0}
      - LEADER_LOCK_TTL_S=${LEADER_LOCK_TTL_S:-15}
      - LEADER_RENEW_INTERVAL_S=${LEADER_RENEW_INTERVAL_S:-5}
      - ACM_ARCHIVE=1
      - AUTOPILOT=${AUTOPILOT:-1}
      # Real-world data on startup (CelesTrak source keys, see GET /api/catalog/sources); empty = off
      - REALWORLD_FLEET=${REALWORLD_FLEET:-}
      - REALWORLD_OBJECTS=${REALWORLD_OBJECTS:-fengyun-1c-debris,cosmos-2251-debris,iridium-33-debris}
      - REALWORLD_LIVE=${REALWORLD_LIVE:-1}
      # How many satellites / debris objects to load on first start (the dashboard can resize the fleet
      # later; a restart restored from Redis keeps the dashboard's choice)
      - REALWORLD_MAX_SATELLITES=${REALWORLD_MAX_SATELLITES:-60}
      - REALWORLD_MAX_OBJECTS=${REALWORLD_MAX_OBJECTS:-5000}
      # Optional bearer token required by GET /metrics (Prometheus `authorization:` setting).
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # Optional Space-Track account: public CDMs as an authoritative Pc/miss cross-check.
      - SPACETRACK_IDENTITY=${SPACETRACK_IDENTITY:-}
      - SPACETRACK_PASSWORD=${SPACETRACK_PASSWORD:-}
      # Operator assistant (POST /api/assistant/chat): a local LLM served by Ollama on the host.
      - ASSISTANT_OLLAMA_URL=${ASSISTANT_OLLAMA_URL:-http://host.docker.internal:11434}
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-qwen3:8b}
      - ASSISTANT_KEEP_ALIVE=${ASSISTANT_KEEP_ALIVE:-2m}
      - ASSISTANT_NUM_CTX=${ASSISTANT_NUM_CTX:-8192}
      - ASSISTANT_NUM_BATCH=${ASSISTANT_NUM_BATCH:-128}
      - NOTIFY_WEBHOOK_URLS=${NOTIFY_WEBHOOK_URLS:-}
      - NOTIFY_MIN_LEVEL=${NOTIFY_MIN_LEVEL:-crit}
      - NOTIFY_CATEGORIES=${NOTIFY_CATEGORIES:-}
      - NOTIFY_MAX_PER_MIN=${NOTIFY_MAX_PER_MIN:-20}
      - MANEUVER_DA_KM=${MANEUVER_DA_KM:-0.1}
      - MANEUVER_DI_DEG=${MANEUVER_DI_DEG:-0.01}
      - MANEUVER_SENSITIVITY=${MANEUVER_SENSITIVITY:-5}
    # host.docker.internal resolves on Docker Desktop already; this mapping adds it on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Runs as uid/gid 1000 (non-root, see Dockerfile) - the bind-mounted host directory must be
    # writable by that uid, e.g. `mkdir -p backend/data && chown -R 1000:1000 backend/data` (or
    # `chmod -R o+rwX backend/data` if you can't chown on your host) before first start.
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Not published to the host - only reachable from other containers on this compose
    # network - but still requires a password so a compromised/misconfigured neighbor
    # container (or a later change that does publish the port) can't read/write mission
    # state or the leader-election lock unauthenticated.
    # --masterauth lets this node rejoin as a replica after a Sentinel failover (`ha` profile).
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-384mb} --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file} --masterauth ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # Fixed address: Sentinel monitors the master by IP - a stopped container's hostname stops
    # resolving, which would leave the sentinels unable to fail over.
    networks:
      default:
        ipv4_address: ${ACM_SUBNET_PREFIX:-172.28.0}.10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file}

  # ── Scheduled + off-site backups (opt-in): docker compose -f docker-compose.prod.yml --profile backup up -d ──
  # `backup` snapshots Redis + the SQLite archive + config every BACKUP_INTERVAL, verifies each
  # backup and keeps the newest BACKUP_KEEP locally; `backup-offsite` copies them to any rclone
  # remote (S3, GCS, Azure, B2, SFTP...) configured in backup.env (see backup.env.example).
  backup:
    image: ${BACKEND_IMAGE:-nsh-backend:latest}
    profiles: [backup]
    restart: unless-stopped
    command: ["python3", "scripts/backup.py", "schedule", "--out-dir", "/app/data/backups",
              "--every", "${BACKUP_INTERVAL:-6h}", "--keep", "${BACKUP_KEEP:-28}"]
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_SENTINELS=${REDIS_SENTINELS:-}
      - REDIS_SENTINEL_MASTER=${REDIS_SENTINEL_MASTER:-acm}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./backend/data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    depends_on:
      - redis

  backup-offsite:
    image: rclone/rclone:1.68
    profiles: [backup]
    restart: unless-stopped
    env_file: [backup.env]
    entrypoint: ["sh", "-c"]
    # `copy`, not `sync`: deleting a local backup never deletes the off-site copy - expire
    # old objects with the bucket's lifecycle policy instead.
    command:
      - 'while true; do rclone copy /backups "$$RCLONE_REMOTE" --exclude "*.tmp" --log-level INFO || echo "off-site copy failed"; sleep "$${BACKUP_SYNC_S:-900}"; done'
    volumes:
      - ./backend/data/backups:/backups:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    depends_on:
      - backup

  # ── High availability (opt-in): docker compose -f docker-compose.prod.yml --profile ha up -d ──
  # One replica + three sentinels (quorum 2). Set REDIS_SENTINELS in .env so the backend asks the
  # sentinels for the current master. Failover takes ~SENTINEL_DOWN_AFTER_MS + a few seconds.
  redis-replica:
    image: redis:7-alpine
    profiles: [ha]
    restart: unless-stopped
    command: redis-server --appendonly yes --replicaof redis 6379 --masterauth ${REDIS_PASSWORD} --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-384mb} --maxmemory-policy noeviction
    volumes:
      - redis_replica_data:/data
    networks:
      default:
        ipv4_address: ${ACM_SUBNET_PREFIX:-172.28.0}.11
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    depends_on:
      - redis

  sentinel-1: &sentinel
    image: redis:7-alpine
    profiles: [ha]
    restart: unless-stopped
    entrypoint: ["sh", "/sentinel-entrypoint.sh"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SENTINEL_MASTER=${REDIS_SENTINEL_MASTER:-acm}
      - SENTINEL_DOWN_AFTER_MS=${SENTINEL_DOWN_AFTER_MS:-5000}
      - REDIS_MASTER_IP=${ACM_SUBNET_PREFIX:-172.28.0}.10
      - REDIS_NODE_IPS=${ACM_SUBNET_PREFIX:-172.28.0}.10 ${ACM_SUBNET_PREFIX:-172.28.0}.11
      - SENTINEL_FAILOVER_TIMEOUT_MS=${SENTINEL_FAILOVER_TIMEOUT_MS:-10000}
    volumes:
      - ./monitoring/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m
    depends_on:
      - redis
      - redis-replica

  sentinel-2: *sentinel

  sentinel-3: *sentinel

  # Optional edge proxy in front of the backend (which already serves the UI on its own).
  # nginx.conf terminates TLS on 443 and redirects plain :80 to it - run
  # scripts/generate-dev-cert.sh for a local/staging self-signed cert, or mount a real
  # certificate (e.g. certbot/Let's Encrypt) at the same ./certs paths for production.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    depends_on:
      - backend

  # ── Monitoring (opt-in): docker compose -f docker-compose.prod.yml --profile monitoring up -d ──
  # Ports bind to 127.0.0.1 only; reach them over an SSH tunnel or put them behind your SSO proxy.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    depends_on:
      - backend

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      # Left unset, Grafana starts with admin/admin and forces a new password at first login.
      # Read only on first start (empty grafana_data volume); later changes go through the UI or API.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/acm-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    depends_on:
      - prometheus

networks:
  default:
    ipam:
      config:
        # Change ACM_SUBNET_PREFIX if 172.28.0.0/24 collides with a network on your host.
        - subnet: ${ACM_SUBNET_PREFIX:-172.28.0}.0/24

volumes:
  redis_data:
  redis_replica_data:
  prometheus_data:
  grafana_data:
